aws_account_id: "111111111111"
aws_region: "ap-southeast-1"
project_tag: "cdp"
environment_tag: "dev"

connector_runtime_stack:
  stack_name: "CdpDatabaseConnectorRuntime"
  project_config:
    # The stack imports the VPC, cluster, one-shot task definitions, and task
    # role. It creates the warm fast-worker task definition and ECS service,
    # but it does not create an ECS cluster, ECR repository, or image.
    vpc:
      vpc_id: "vpc-xxxxxxxx"
      availability_zones: ["ap-southeast-1a", "ap-southeast-1b"]
      private_subnet_ids: ["subnet-aaaaaaaa", "subnet-bbbbbbbb"]
      private_subnet_route_table_ids: ["rtb-aaaaaaaa", "rtb-bbbbbbbb"]
      security_group_ids: ["sg-xxxxxxxx"]
    ecs:
      cluster_name: "identity-cluster"
      connector_task_definition_arn: "arn:aws:ecs:ap-southeast-1:111111111111:task-definition/connector-worker:1"
      connector_container_name: "connector-worker"
      connector_task_role_arn: "arn:aws:iam::111111111111:role/connector-worker-task"
      fast_worker_enabled: true
      # Required immutable image digest. Tags such as :latest are rejected.
      fast_worker_image_uri: "111111111111.dkr.ecr.ap-southeast-1.amazonaws.com/connector-worker@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      fast_worker_container_name: "connector-fast-worker"
      fast_worker_cpu: 1024
      fast_worker_memory_limit_mib: 2048
      fast_worker_desired_count: 1
      stitcher_task_definition_arn: "arn:aws:ecs:ap-southeast-1:111111111111:task-definition/identity-stitcher:1"
      stitcher_container_name: "identity-stitcher"
      pass_role_arns:
        - "arn:aws:iam::111111111111:role/connector-worker-task"
        - "arn:aws:iam::111111111111:role/connector-worker-execution"
        - "arn:aws:iam::111111111111:role/identity-stitcher-task"
        - "arn:aws:iam::111111111111:role/identity-stitcher-execution"
    landing_bucket_name: "cdp-connector-landing"
    warehouse_secret_arn: "arn:aws:secretsmanager:ap-southeast-1:111111111111:secret:warehouse-xxxxxx"
    connector_source_secret_arn_pattern: "arn:aws:secretsmanager:ap-southeast-1:111111111111:secret:connector/*"
    backend_principal_arn: "arn:aws:iam::111111111111:role/journey-builder-api"
    scheduler_group_name: "cdp-database-connectors"
    kms_alias: "alias/cdp-database-connectors"
    workflow_timeout_hours: 6
    dispatcher_concurrency: 5
    queue_retention_days: 14
    fast_queue_visibility_timeout_seconds: 300
    # Must be no more than half of fast_queue_visibility_timeout_seconds.
    fast_worker_heartbeat_seconds: 60
    fast_worker_poll_wait_seconds: 20
    # Queue redrive uses this value plus one final claim-only delivery.
    fast_worker_max_attempts: 5
    fast_worker_shutdown_grace_seconds: 110
    fast_queue_oldest_age_alarm_seconds: 120
    fast_queue_backlog_alarm_threshold: 10
