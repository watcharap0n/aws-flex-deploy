aws_account_id: "111111111111"
aws_region: "ap-southeast-1"
project_tag: "cdp"
environment_tag: "dev"

standardization_runtime_stack:
  stack_name: "CdpElasticsearchStandardizationRuntime"
  project_config:
    vpc:
      vpc_id: "vpc-xxxxxxxx"
      availability_zones: ["ap-southeast-1a", "ap-southeast-1b"]
      private_subnet_ids: ["subnet-aaaaaaaa", "subnet-bbbbbbbb"]
      private_subnet_route_table_ids: ["rtb-aaaaaaaa", "rtb-bbbbbbbb"]
      security_group_ids: ["sg-xxxxxxxx"]
    ecs:
      cluster_name: "identity-cluster"
      container_name: "elasticsearch-standardization-worker"
      image_uri: "111111111111.dkr.ecr.ap-southeast-1.amazonaws.com/elasticsearch-standardization-worker:merge-lock-20260902-v1"
      source_database_secret_arn: "arn:aws:secretsmanager:ap-southeast-1:111111111111:secret:warehouse-xxxxxx"
      warehouse_database_secret_arn: "arn:aws:secretsmanager:ap-southeast-1:111111111111:secret:warehouse-xxxxxx"
      source_database_name: "elasticsearch"
      warehouse_database_name: "postgres"
      cpu: 1024
      memory_limit_mib: 2048
      page_size: 1000
      load_statement_timeout_seconds: 900
      merge_lock_timeout_seconds: 1800
    backend_principal_arn: "arn:aws:iam::111111111111:role/journey-builder-api"
    kms_alias: "alias/cdp-elasticsearch-standardization"
    dispatcher_concurrency: 5
